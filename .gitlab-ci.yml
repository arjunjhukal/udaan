stages:
  - install
  - build
  - deploy

variables:
  NODE_ENV: production
  DEPLOY_PATH: /var/www/udaan

cache:
  key: "node-modules-${CI_COMMIT_REF_SLUG}"
  paths:
    - node_modules/
    - .npm/

# ----------------------------
# INSTALL DEPENDENCIES
# ----------------------------
install:
  stage: install
  image: node:20
  tags:
    - dev
  only:
    - dev
  script:
    - npm ci --prefer-offline --no-audit

# ----------------------------
# BUILD + LINT
# ----------------------------
build:
  stage: build
  image: node:20
  tags:
    - dev
  only:
    - dev
  script:
    - npm run lint
    - VITE_API_BASE_URL=$VITE_API_BASE_URL npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# ----------------------------
# DEPLOY TO SERVER
# ----------------------------
deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - dev
  only:
    - dev
  before_script:
    - apk add --no-cache rsync openssh curl
    - mkdir -p ~/.ssh
    - echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - rsync -avz --delete dist/ $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -X POST -H "Content-Type: application/json" \
        --data '{"text":"✅ Deployment Successful!"}' \
        $SLACK_WEBHOOK_URL
      else
        curl -X POST -H "Content-Type: application/json" \
        --data '{"text":"❌ Deployment Failed!"}' \
        $SLACK_WEBHOOK_URL
      fi
